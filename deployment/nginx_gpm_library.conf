# Nginx configuration for Government Polytechnic Madhogarh Central Library Portal
# Domain: gpmadhogarh.ac.in (or library.gpmadhogarh.ac.in)

upstream gpm_django_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name gpmadhogarh.ac.in library.gpmadhogarh.ac.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gpmadhogarh.ac.in library.gpmadhogarh.ac.in;

    # SSL Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/gpmadhogarh.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gpmadhogarh.ac.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    client_max_body_size 25M;

    # Static Assets Cache
    location /static/ {
        alias /var/www/gpm_library/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Uploads (User avatars, covers, attachments, PDFs)
    location /media/ {
        alias /var/www/gpm_library/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Proxy all dynamic requests to Gunicorn WSGI
    location / {
        proxy_pass http://gpm_django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

